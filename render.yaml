services:
  # Backend Web Service
  - type: web
    name: securepay-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: securepay-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: SUPER_ADMIN_PHONE
        value: "+917991234567"
      - key: SUPER_ADMIN_PASSWORD
        value: "SuperAdmin@123"

databases:
  # Managed PostgreSQL Database
  - name: securepay-db
    plan: free
    databaseName: Securepaydb
    user: postgres

