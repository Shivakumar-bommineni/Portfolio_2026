version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: securepay-postgres
    restart: always
    environment:
      POSTGRES_DB: Securepaydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securepay_prod_db_password_123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Securepaydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API + Socket.IO (Auto-migrates & Auto-seeds on start)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securepay-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://postgres:securepay_prod_db_password_123@postgres:5432/Securepaydb
      FRONTEND_URL: http://localhost:5174
      CLIENT_URL: http://localhost:5174
      JWT_ACCESS_SECRET: securepay_production_jwt_access_secret_key_999888
      JWT_REFRESH_SECRET: securepay_production_jwt_refresh_secret_key_888777
      COOKIE_SECRET: securepay_production_cookie_secret_salt_777666
      SUPER_ADMIN_PHONE: +917991234567
      SUPER_ADMIN_PASSWORD: SuperAdmin@123
      SUPER_ADMIN_NAME: "Shivakumar Admin"
    ports:
      - "5000:5000"

volumes:
  pgdata:

